{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            position:relative;
            overflow:hidden;
        }

        .login-container{
            width:380px;
            background:#fff;
            padding:40px;
            border-radius:12px;
            box-shadow:0 6px 20px rgba(0,0,0,0.1);
        }

        .login-container h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .form-group{
            margin-bottom:18px;
        }

        .form-group label{
            display:block;
            margin-bottom:6px;
            color:#555;
            font-weight:600;
        }

        .form-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:14px;
        }

        .form-group input:focus{
            outline:none;
            border-color:#0078d4;
        }

        .login-btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            background:#0078d4;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .login-btn:hover{
            background:#005ea6;
        }

        .forgot-password{
            text-align:center;
            margin-top:15px;
        }

        .forgot-password a{
            text-decoration:none;
            color:#0078d4;
        }

        /* Bottom Right Image */
        .bottom-image{
            position:fixed;
            bottom:20px;
            right:20px;
            width:220px;
            height:auto;
            opacity:0.9;
        }

        @media (max-width: 768px){
            .bottom-image{
                width:140px;
            }

            .login-container{
                width:90%;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>

        <form>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>

            <div class="forgot-password">
                #Forgot Password?</a>
            </div>
        </form>
    </div>

    <img src="{% static 'images\source_user.png' %}" alt="">

</body>
</html>
